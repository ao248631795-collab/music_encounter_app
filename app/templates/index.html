{% extends "base.html" %}
{% block title %}ホーム | 音楽すれ違いアプリ{% endblock %}
{% block content %}
<div class="text-center py-5">
  <h1 class="display-5 fw-bold" style="color:var(--accent);">すれ違った人の音楽が、そっと教えてくれる。</h1>
  <p class="lead text-secondary mt-3">近くにいた人が聴いていた曲が、プレイリストに届く。</p>

  <div class="d-flex justify-content-center gap-3 mt-4 flex-wrap">
    <div class="card p-4" style="min-width:160px;">
      <div class="fw-bold" style="color:var(--accent); font-size:2rem;">{{ today_count }}人</div>
      <div class="text-secondary small mt-1">今日のすれ違い</div>
    </div>
    <div class="card p-4" style="min-width:160px;">
      <div class="fw-bold" style="color:var(--accent); font-size:2rem;">{{ total_count }}人</div>
      <div class="text-secondary small mt-1">これまでのすれ違い</div>
    </div>
  </div>

  <div class="d-flex justify-content-center gap-3 mt-4 flex-wrap">
    <a href="/songs" class="btn btn-primary btn-lg">🎵 マイ曲を設定する</a>
    <a href="/locations" class="btn btn-outline-light btn-lg">📍 位置情報を登録する</a>
  </div>
</div>
{% endblock %}
