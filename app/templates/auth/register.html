{% extends "base.html" %}
{% block title %}新規登録 | 音楽すれ違いアプリ{% endblock %}
{% block content %}
<div class="d-flex justify-content-center">
  <div class="card p-4" style="max-width:420px; width:100%;">
    <h2 class="mb-4 text-center">新規登録</h2>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post" action="/register">
      <div class="mb-3">
        <label class="form-label">ニックネーム</label>
        <input type="text" name="nickname" value="{{ nickname or '' }}" class="form-control"
               maxlength="30" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">パスワード</label>
        <input type="password" name="password" class="form-control" required>
        <div class="form-text text-secondary small">8文字以上で入力してください。</div>
      </div>
      <div class="mb-3">
        <label class="form-label">パスワード（確認）</label>
        <input type="password" name="password_confirm" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">登録する</button>
    </form>

    <p class="text-secondary small text-center mt-3 mb-0">
      すでにアカウントをお持ちの方は <a href="/login" style="color: var(--accent);">ログインはこちら</a>
    </p>
  </div>
</div>
{% endblock %}
